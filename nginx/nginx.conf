# ─────────────────────────────────────────────────────────────────────────────
# VARify — Nginx reverse-proxy configuration
#
# Place this file on the host (or inside a dedicated nginx container) and
# point it at the Django/Daphne container exposed on port 8000.
#
# Usage with Docker Compose:
#   Add an nginx service to docker-compose.yml:
#
#     nginx:
#       image: nginx:1.27-alpine
#       ports:
#         - "80:80"
#         - "443:443"
#       volumes:
#         - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#         - ./nginx/certs:/etc/nginx/certs:ro   # place your SSL certs here
#       depends_on:
#         - web
#
# Three-layer bot defence (outermost to innermost):
#   1. Nginx  — blocks at TCP/HTTP level, zero Python overhead
#   2. _ASGIBotShield (asgi.py) — blocks before ProtocolTypeRouter task spawn
#   3. MaliciousBotDefenseMiddleware (middleware.py) — blocks before any DB query
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── upstream: Django/Daphne container ────────────────────────────────────
    upstream django_app {
        server web:8000;
        keepalive 16;
    }

    # ── map: detect malicious request URIs ───────────────────────────────────
    # Matches against $request_uri (path + query string, URL-encoded).
    map $request_uri $varify_is_malicious {
        default                             0;

        # Environment / config files
        ~*\.env([.\-_]|$)                  1;
        ~*\.env\.(production|local|dev
                  |development|staging
                  |bak|backup|old|save)     1;

        # Git repository leaks
        ~*/\.git(/|$)                       1;
        ~*\.git/config                      1;

        # Backup / dump file extensions
        ~*\.(bak|old|save|orig|swp
             |sql|dump|log)(\?|&|#|/|$)    1;

        # WordPress probes
        ~*wp-admin                          1;
        ~*wp-login\.php                     1;
        ~*wp-config\.php                    1;

        # phpMyAdmin
        ~*phpMyAdmin                        1;
        ~*phpmyadmin                        1;

        # Hidden dot-files / web server config
        ~*/\.htaccess                       1;
        ~*/\.htpasswd                       1;

        # LFI probes
        ~*/etc/passwd                       1;
        ~*/etc/shadow                       1;
        ~*/etc/hosts                        1;

        # Generic PHP / ASP / JSP file probes (not used by this stack)
        ~*\.(php|asp|aspx|jsp|cgi)(\?|$)   1;
    }

    # ── HTTP server (redirect to HTTPS in production) ────────────────────────
    server {
        listen 80;
        server_name _;

        # Redirect all HTTP → HTTPS (remove this block if TLS is terminated elsewhere)
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"        always;
        add_header X-Frame-Options         "SAMEORIGIN"     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ── Rate limiting (add zone to http block if needed) ─────────────────
        # limit_req zone=per_ip burst=20 nodelay;

        # ── Malicious bot rejection ───────────────────────────────────────────
        # Fires before any upstream connection is opened — zero Python cost.
        if ($varify_is_malicious) {
            return 403 "Not Allowed";
        }

        # Block hidden dot-files (catches /.git/, /.env etc. as a catch-all)
        location ~ /\. {
            return 403;
        }

        # ── WebSocket (Django Channels / Daphne) ─────────────────────────────
        location /ws/ {
            proxy_pass          http://django_app;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_read_timeout  86400s;   # keep WS connections alive
        }

        # ── All other requests → Django ───────────────────────────────────────
        location / {
            proxy_pass          http://django_app;
            proxy_http_version  1.1;
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }
    }
}
