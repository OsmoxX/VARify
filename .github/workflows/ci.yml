name: Django Professional CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. SPRAWDZANIE STYLU (Linting)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff (Lint & Format)
        run: ruff check .

  # 2. SKANOWANIE BEZPIECZEŃSTWA (Security)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit & Safety
        run: pip install bandit safety
      - name: Run Bandit (Code security)
        run: bandit -r matches/ -x matches/tests/
      - name: Run Safety
        run: safety check --full-report || echo "Warnings found"

  # 3. KONTROLA TYPÓW (Type Checking)
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy django-stubs types-requests
      - name: Run Mypy
        run: mypy . --explicit-package-bases

  # 4. GŁÓWNE TESTY (Unit Tests)
  test:
    runs-on: ubuntu-latest
    needs: [lint] # Opcjonalnie: testy ruszą tylko jeśli styl jest OK
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: varify_db
          MYSQL_ROOT_PASSWORD: supertajnehaslo
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Install Python Dependencies
        run: pip install -r requirements.txt pytest-asyncio
      - name: Setup Host Aliases
        run: |
          sudo echo "127.0.0.1 db" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 redis" | sudo tee -a /etc/hosts
      - name: Collect static files
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-secret-key"
          DATABASE_URL: "mysql://root:supertajnehaslo@127.0.0.1:3306/varify_db"
        run: python manage.py collectstatic --noinput
      - name: Run Pytest
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-secret-key"
        run: pytest --cov=matches --cov-report=xml