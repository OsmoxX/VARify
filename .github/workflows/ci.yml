name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: varify_db
          MYSQL_ROOT_PASSWORD: supertajnehaslo
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Host Aliases
      # Ten krok sprawia, że Twoje settings.py (szukające "db" i "redis") zadziałają bez zmian
      run: |
        sudo echo "127.0.0.1 db" | sudo tee -a /etc/hosts
        sudo echo "127.0.0.1 redis" | sudo tee -a /etc/hosts

    - name: Run Tests with Coverage
      env:
        DEBUG: "False"
        SECRET_KEY: "django-insecure-ci-key"
        # Przekazujemy zmienne, które masz w settings.py
        MYSQL_DATABASE: varify_db
        MYSQL_ROOT_PASSWORD: supertajnehaslo
      run: |
        pytest --cov=matches --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}