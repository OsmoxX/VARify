name: Playwright E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Stała ścieżka do folderu z package.json i playwright.config.ts
# Używamy jej w każdym kroku wymagającym Node/Playwright.
env:
  PW_DIR: matches/tests/e2e

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache npm dependencies z właściwego folderu
          cache: 'npm'
          cache-dependency-path: matches/tests/e2e/package-lock.json

      # ── Node: instalacja zależności i przeglądarek ─────────────────────────
      # working-directory wskazuje na folder zawierający package.json
      - name: Install Node dependencies
        working-directory: ${{ env.PW_DIR }}
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ${{ env.PW_DIR }}
        run: npx playwright install --with-deps chromium

      # ── Docker: budujemy i startujemy kontenery (z katalogu głównego) ──────
      - name: Start Docker containers
        run: |
          docker compose up -d
          sleep 15

      - name: Run Django migrations
        run: docker compose exec -T web python manage.py migrate

      - name: Wait for app to be ready
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:8000/login/ && echo "App is up!" && break
            echo "Waiting... ($i/20)"
            sleep 3
          done

      # ── Playwright: uruchamia testy (z folderu e2e) ────────────────────────
      - name: Run Playwright tests
        working-directory: ${{ env.PW_DIR }}
        run: npx playwright test 
        env:
          BASE_URL: http://localhost:8000
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # ── Artefakty: zawsze upload raportu, nawet przy błędzie ──────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.PW_DIR }}/playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots / videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.PW_DIR }}/test-results/
          retention-days: 7