name: Playwright E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Stała ścieżka do folderu z package.json i playwright.config.ts
# Używamy jej w każdym kroku wymagającym Node/Playwright.
env:
  PW_DIR: matches/tests/e2e

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache npm dependencies z właściwego folderu
          cache: 'npm'
          cache-dependency-path: matches/tests/e2e/package-lock.json

      # ── Node: instalacja zależności i przeglądarek ─────────────────────────
      # working-directory wskazuje na folder zawierający package.json
      - name: Install Node dependencies
        working-directory: ${{ env.PW_DIR }}
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ${{ env.PW_DIR }}
        run: npx playwright install --with-deps

      # ── Tworzymy plik .env z GitHub Secrets przed startem Dockera ──────────
      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          SPORT_API_KEY=${{ secrets.SPORT_API_KEY }}
          SPORT_API_HOST=${{ secrets.SPORT_API_HOST }}
          STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID_PLUS=${{ secrets.STRIPE_PRICE_ID_PLUS }}
          STRIPE_PRICE_ID_PREMIUM=${{ secrets.STRIPE_PRICE_ID_PREMIUM }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          EOF

      # ── Docker: budujemy i startujemy kontenery (z katalogu głównego) ──────
      - name: Start Docker containers
        run: |
          docker compose up -d
          sleep 15


      - name: Run Django migrations
        run: docker compose exec -T web python manage.py migrate
        
      - name: Initialize Data and Social Apps for CI
        run: |
          docker compose exec -T web python manage.py shell -c "
          from allauth.socialaccount.models import SocialApp;
          from django.contrib.sites.models import Site;
          from django.contrib.auth import get_user_model;
          User = get_user_model();
          User.objects.filter(username='test_fan_99').exists() or User.objects.create_user('test_fan_99', 'test@example.com', 'Strong!Password123#');
          site, _ = Site.objects.get_or_create(id=1, defaults={'domain':'localhost', 'name':'localhost'});
          app, _ = SocialApp.objects.get_or_create(provider='google', name='Google Dummy', client_id='dummy', secret='dummy');
          app.sites.add(site);
          "

      - name: Seed E2E tier users (Free / Plus / Premium)
        env:
          E2E_USERNAME_FREE:    ${{ secrets.E2E_USERNAME_FREE    != '' && secrets.E2E_USERNAME_FREE    || 'e2e_free_user'    }}
          E2E_PASSWORD_FREE:    ${{ secrets.E2E_PASSWORD_FREE    != '' && secrets.E2E_PASSWORD_FREE    || 'E2e!Free2024#'    }}
          E2E_USERNAME_PLUS:    ${{ secrets.E2E_USERNAME_PLUS    != '' && secrets.E2E_USERNAME_PLUS    || 'e2e_plus_user'    }}
          E2E_PASSWORD_PLUS:    ${{ secrets.E2E_PASSWORD_PLUS    != '' && secrets.E2E_PASSWORD_PLUS    || 'E2e!Plus2024#'    }}
          E2E_USERNAME_PREMIUM: ${{ secrets.E2E_USERNAME_PREMIUM != '' && secrets.E2E_USERNAME_PREMIUM || 'e2e_premium_user' }}
          E2E_PASSWORD_PREMIUM: ${{ secrets.E2E_PASSWORD_PREMIUM != '' && secrets.E2E_PASSWORD_PREMIUM || 'E2e!Premium2024#' }}
        run: |
          docker compose exec -T \
            -e E2E_USERNAME_FREE    -e E2E_PASSWORD_FREE \
            -e E2E_USERNAME_PLUS    -e E2E_PASSWORD_PLUS \
            -e E2E_USERNAME_PREMIUM -e E2E_PASSWORD_PREMIUM \
            web python manage.py create_e2e_users

      - name: Collect static files and RESTART
        run: |
          docker compose exec -T web python manage.py collectstatic --noinput
          docker compose restart web
          
      - name: Verify static files exist
        run: docker compose exec -T web ls -R staticfiles/matches/css || echo "CSS NOT FOUND!"

      - name: Wait for app to be ready
        run: |
          for i in {1..20}; do
            # Używamy -w żeby wyciągnąć kod i zapisujemy ciało odpowiedzi do pliku html
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" http://localhost:8000/)
            
            if [ "$STATUS" = "200" ]; then
              echo "App is up and responding with HTTP 200!"
              exit 0
            fi
            
            echo "Waiting for app... HTTP $STATUS ($i/20)"
            
            # Jeśli dostaniemy twardy błąd serwera (500), wypisz zawartość, by odkryć przyczynę (Traceback z Django)
            if [ "$STATUS" = "500" ]; then
              echo "=== ERROR 500 DETECTED! Printing response snippet (Traceback) ==="
              cat response.html | grep -i "Exception" -A 15 || head -n 50 response.html
            fi
            
            sleep 3
          done
          echo "Timed out waiting for app"
          exit 1

      # ── Playwright: uruchamia testy (z folderu e2e) ────────────────────────
      - name: Run Playwright tests
        working-directory: ${{ env.PW_DIR }}
        run: npx playwright test
        env:
          BASE_URL:             http://localhost:8000
          # Legacy single-user credentials (kept for backward-compat)
          E2E_USERNAME:         ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD:         ${{ secrets.E2E_PASSWORD }}
          # Tier-specific credentials (used by global-setup.ts)
          E2E_USERNAME_FREE:    ${{ secrets.E2E_USERNAME_FREE    != '' && secrets.E2E_USERNAME_FREE    || 'e2e_free_user'    }}
          E2E_PASSWORD_FREE:    ${{ secrets.E2E_PASSWORD_FREE    != '' && secrets.E2E_PASSWORD_FREE    || 'E2e!Free2024#'    }}
          E2E_USERNAME_PLUS:    ${{ secrets.E2E_USERNAME_PLUS    != '' && secrets.E2E_USERNAME_PLUS    || 'e2e_plus_user'    }}
          E2E_PASSWORD_PLUS:    ${{ secrets.E2E_PASSWORD_PLUS    != '' && secrets.E2E_PASSWORD_PLUS    || 'E2e!Plus2024#'    }}
          E2E_USERNAME_PREMIUM: ${{ secrets.E2E_USERNAME_PREMIUM != '' && secrets.E2E_USERNAME_PREMIUM || 'e2e_premium_user' }}
          E2E_PASSWORD_PREMIUM: ${{ secrets.E2E_PASSWORD_PREMIUM != '' && secrets.E2E_PASSWORD_PREMIUM || 'E2e!Premium2024#' }}

      # ── Artefakty: zawsze upload raportu, nawet przy błędzie ──────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.PW_DIR }}/playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots / videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.PW_DIR }}/test-results/
          retention-days: 7

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs