{% extends 'matches/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'matches/search_results.css' %}">
{% endblock %}

{% block content %}
<div class="calendar-container search-container">
    <div class="header-section search-header">
        <h1 class="page-title" id="search-title">
            <i class="fa-solid fa-magnifying-glass"></i> Wyniki wyszukiwania
        </h1>
        <a href="javascript:history.back()" class="back-btn-modern">
            <i class="fa-solid fa-arrow-left"></i> Wróć
        </a>
    </div>

    <div id="search-results">
        <div class="loading-state">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p>Wyszukiwanie...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'matches/js/search_results.js' %}"></script>
{% endblock %}
