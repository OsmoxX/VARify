{% extends 'matches/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'matches/match_detail.css' %}">
<link rel="stylesheet" href="{% static 'matches/team_detail.css' %}">
<link rel="stylesheet" href="{% static 'matches/league_detail.css' %}">
{% endblock %}

{% block content %}
<div class="detail-wrapper" data-api-id="{{ api_id }}">
    <a class="back-btn-modern" href="/">
        <i class="fa-solid fa-chevron-left"></i> Powrót
    </a>

    <!-- NAGŁÓWEK DRUŻYNY -->
    <div class="team-header">
        <img class="team-logo" id="team-logo" src="/static/matches/placeholder.png" alt="" style="display:none;">
        <div class="team-logo-placeholder" id="team-logo-fallback">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="team-name-section">
            <h1 id="team-name">Ładowanie...</h1>
            <div class="team-meta" id="team-meta"></div>
        </div>
    </div>

    <!-- SYSTEM ZAKŁADEK -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('matches', this)">
            <i class="fa-regular fa-calendar-days"></i> Mecze
        </button>
        <button class="tab-btn" onclick="switchTab('standings', this)">
            <i class="fa-solid fa-list-ol"></i> Tabela ligi
        </button>
    </div>

    <!-- ZAKŁADKA 1: MECZE + SKŁAD -->
    <div id="tab-matches" class="tab-content active">
        <div class="team-section">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Ostatnie mecze</h2>
            <div id="recent-matches-list">
                <div class="loading-state"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
            </div>
        </div>
        <div class="team-section" id="squad-section" style="display:none;">
            <h2><i class="fa-solid fa-users"></i> Skład (z ostatniego meczu)</h2>
            <div class="squad-grid" id="squad-grid"></div>
        </div>
    </div>

    <!-- ZAKŁADKA 2: TABELA -->
    <div id="tab-standings" class="tab-content" style="display: none;">
        <div class="team-section">
            <h2><i class="fa-solid fa-list-ol"></i> Tabela ligowa <span id="standings-league-name"></span></h2>
            <div class="table-container">
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th class="col-pos">#</th>
                            <th class="col-team">Drużyna</th>
                            <th class="col-num" title="Mecze Rozegrane">M</th>
                            <th class="col-num" title="Wygrane">W</th>
                            <th class="col-num" title="Remisy">R</th>
                            <th class="col-num" title="Porażki">P</th>
                            <th class="col-num" title="Bramki">B+ / B-</th>
                            <th class="col-num" title="Różnica Bramek">+/-</th>
                            <th class="col-pts">Pkt</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        <tr><td colspan="9" class="empty-table"><i class="fa-solid fa-circle-notch fa-spin"></i></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'matches/js/team_detail.js' %}"></script>
{% endblock %}
