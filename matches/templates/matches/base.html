{% load static %}
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VARify{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'matches/base.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav class="navbar">
        <a href="/" class="nav-brand">
            <i class="fa-solid fa-futbol"></i> VAR<span>ify</span>
        </a>

        <div class="nav-search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="live-search-input" class="nav-search-input" placeholder="Szukaj drużyny (Enter)"
                autocomplete="off">

            <div id="search-results-dropdown" class="search-dropdown" style="display: none;"></div>
        </div>

        <div class="nav-links">
            <a href="/" class="nav-link">
                <i class="fa-solid fa-tower-broadcast"></i> Mecze na żywo
            </a>
            <a href="{% url 'calendar' %}" class="nav-link">
                <i class="fa-solid fa-calendar-days"></i> Kalendarz
            </a>

            <!-- ========== PANEL POWIADOMIEŃ ========== -->
            <div class="notif-wrapper" id="notif-wrapper">
                <button class="notif-bell-btn" id="notif-bell-btn" title="Powiadomienia" aria-label="Powiadomienia">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notif-badge" id="notif-badge" style="display:none;"></span>
                </button>
                <div class="notif-panel" id="notif-panel">
                    <div class="notif-panel-header">
                        <span>Powiadomienia</span>
                        <button class="notif-clear-btn" id="notif-clear-btn" title="Wyczyść wszystkie">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    <div class="notif-panel-body" id="notif-panel-body">
                        <div class="notif-empty" id="notif-empty">
                            <i class="fa-solid fa-bell-slash"></i>
                            <p>Brak powiadomień</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Dźwięk powiadomienia (krótki ping wygenerowany programowo) -->
    <script>
    // ========================================================
    // NOTIFICATION PANEL — globalny system powiadomień
    // ========================================================

    // --- Audio: generujemy dźwięk programowo (bez pliku mp3) ---
    const NotifSound = {
        _ctx: null,
        play() {
            try {
                if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)();
                const ctx = this._ctx;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);        // A5
                osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.1); // C#6
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.4);
            } catch(e) { /* brak audio — bez problemu */ }
        }
    };

    // --- localStorage: persistent notifications ---
    const NOTIF_KEY = 'varify_notifications';
    const UNREAD_KEY = 'varify_unread_count';

    function getNotifications() {
        try { return JSON.parse(localStorage.getItem(NOTIF_KEY)) || []; }
        catch { return []; }
    }

    function saveNotifications(list) {
        // Max 50 powiadomień
        if (list.length > 50) list = list.slice(0, 50);
        localStorage.setItem(NOTIF_KEY, JSON.stringify(list));
    }

    function getUnreadCount() {
        return parseInt(localStorage.getItem(UNREAD_KEY) || '0', 10);
    }

    function setUnreadCount(n) {
        localStorage.setItem(UNREAD_KEY, String(Math.max(0, n)));
        renderBadge();
    }

    // --- Badge (czerwona kropka z liczbą) ---
    function renderBadge() {
        const badge = document.getElementById('notif-badge');
        const count = getUnreadCount();
        if (count > 0) {
            badge.textContent = count > 9 ? '9+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }

    // --- Render listy powiadomień ---
    function renderNotifications() {
        const body = document.getElementById('notif-panel-body');
        const empty = document.getElementById('notif-empty');
        const notifs = getNotifications();

        // Usuń stare elementy (ale zachowaj "empty" div)
        body.querySelectorAll('.notif-item').forEach(el => el.remove());

        if (notifs.length === 0) {
            empty.style.display = 'flex';
            return;
        }
        empty.style.display = 'none';

        notifs.forEach((n, i) => {
            const item = document.createElement('div');
            item.className = 'notif-item' + (i < getUnreadCount() ? ' notif-unread' : '');
            item.innerHTML = `
                <span class="notif-icon">${n.icon || 'ℹ️'}</span>
                <div class="notif-content">
                    <div class="notif-text">${n.message}</div>
                    <div class="notif-time">${n.time || ''}</div>
                </div>
            `;
            body.appendChild(item);
        });
    }

    // --- API publiczne: dodawanie powiadomień (wywoływane z live_match_list.html) ---
    window.VarifyNotif = {
        add(icon, message, eventType) {
            const notifs = getNotifications();
            const now = new Date();
            const time = now.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
            notifs.unshift({ icon, message, eventType, time });
            saveNotifications(notifs);
            setUnreadCount(getUnreadCount() + 1);
            renderNotifications();
            NotifSound.play();
        }
    };

    // --- Toggle panelu ---
    const bellBtn = document.getElementById('notif-bell-btn');
    const panel = document.getElementById('notif-panel');

    bellBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = panel.classList.toggle('notif-panel-open');
        if (isOpen) {
            setUnreadCount(0);
            renderNotifications();
        }
    });

    // Zamknij panel kliknięciem poza nim
    document.addEventListener('click', function(e) {
        const wrapper = document.getElementById('notif-wrapper');
        if (!wrapper.contains(e.target)) {
            panel.classList.remove('notif-panel-open');
        }
    });

    // Wyczyść wszystkie
    document.getElementById('notif-clear-btn').addEventListener('click', function() {
        localStorage.removeItem(NOTIF_KEY);
        setUnreadCount(0);
        renderNotifications();
    });

    // Init
    renderBadge();
    renderNotifications();

    // ========================================================
    // GLOBALNY MENADŻER WEBSOCKETÓW — działa na każdej stronie
    // Połączenia WS trwają tak długo jak przeglądarka jest otwarta,
    // niezależnie od nawigacji między podstronami.
    // ========================================================
    const WS_SUBS_KEY = 'varify_ws_subs';
    const _activeWS = {};

    function getSubscribedWsIds() {
        try { return JSON.parse(localStorage.getItem(WS_SUBS_KEY)) || []; }
        catch { return []; }
    }

    function saveSubscribedWsIds(ids) {
        localStorage.setItem(WS_SUBS_KEY, JSON.stringify(ids));
    }

    function openMatchWS(matchId) {
        if (_activeWS[matchId] && _activeWS[matchId].readyState <= 1) return; // already open/connecting
        const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${scheme}://${location.host}/ws/matches/${matchId}/`);
        ws.onopen = () => console.log(`🟢 [Global WS] connected: match ${matchId}`);
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            console.log(`📨 [Global WS] match ${matchId}:`, data);
            // Powiadomienie w panelu + dźwięk
            if (window.VarifyNotif) window.VarifyNotif.add(data.icon, data.message, data.event_type);
            // Toast — tylko jeśli funkcja dostępna (strona live)
            if (window.showMatchToast) window.showMatchToast(data.icon, data.message, data.event_type);
            // Live DOM update — tylko jeśli strona live
            if (window.updateMatchRow) window.updateMatchRow(matchId, data);
            // Mecz zakończony — automatycznie odsubskrybuj i zamknij WS
            if (data.is_ended) {
                console.log(`🏁 [Global WS] mecz ${matchId} zakończony — zamykam subskrypcję`);
                window.VarifyWS.unsubscribe(matchId);
                // Usuń wizualnie dzwoneczek (jeśli jesteśmy na stronie live)
                const btn = document.querySelector('.bell-btn[data-match-id="' + matchId + '"]');
                if (btn) {
                    btn.classList.remove('bell-active');
                    btn.title = 'Mecz zakończony';
                    btn.disabled = true;
                }
            }
        };
        ws.onclose = () => {
            console.log(`🔴 [Global WS] closed: match ${matchId}`);
            delete _activeWS[matchId];
            // Auto-reconnect po 3s jeśli nadal subskrybowany
            if (getSubscribedWsIds().includes(matchId)) {
                setTimeout(() => openMatchWS(matchId), 3000);
            }
        };
        ws.onerror = () => ws.close();
        _activeWS[matchId] = ws;
    }

    function closeMatchWS(matchId) {
        if (_activeWS[matchId]) {
            _activeWS[matchId].onclose = null; // nie auto-reconnect
            _activeWS[matchId].close();
            delete _activeWS[matchId];
        }
    }

    // Publiczne API dla live_match_list.html — toggle subskrypcji WS
    window.VarifyWS = {
        subscribe(matchId) {
            const ids = getSubscribedWsIds();
            if (!ids.includes(matchId)) {
                ids.push(matchId);
                saveSubscribedWsIds(ids);
            }
            openMatchWS(matchId);
        },
        unsubscribe(matchId) {
            const ids = getSubscribedWsIds().filter(id => id !== matchId);
            saveSubscribedWsIds(ids);
            closeMatchWS(matchId);
        },
        isSubscribed(matchId) {
            return getSubscribedWsIds().includes(matchId);
        },
        getIds() {
            return getSubscribedWsIds();
        }
    };

    // Otwórz połączenia WS — ale najpierw wyczyść zakończone mecze z localStorage
    (function pruneAndConnect() {
        const ids = getSubscribedWsIds();
        if (ids.length === 0) return;

        // Zapytaj backend które z tych meczów są nadal live (nie zakończone)
        fetch('/api/active-match-ids/?ids=' + ids.join(','))
            .then(r => r.json())
            .then(data => {
                const activeIds = data.active_ids || [];
                const staleIds = ids.filter(id => !activeIds.includes(id));

                // Usuń zakończone z localStorage
                if (staleIds.length > 0) {
                    console.log('🗑️ VarifyWS: usuwam zakończone subskrypcje:', staleIds);
                    saveSubscribedWsIds(activeIds);
                }

                // Otwórz WS tylko dla aktywnych
                activeIds.forEach(id => openMatchWS(id));
            })
            .catch(() => {
                // Sieć niedostępna — otwórz wszystkie (WS same się odepną gdy mecz się skończy)
                ids.forEach(id => openMatchWS(id));
            });
    })();

    // --- Wyszukiwarka (Enter) ---
    const searchInput = document.getElementById('live-search-input');
    searchInput.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const query = this.value.trim();
        if (query.length < 2) return;
        window.location.href = `/search-api/?q=${encodeURIComponent(query)}`;
    });
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
