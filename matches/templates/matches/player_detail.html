{% extends "matches/base.html" %}
{% load static %}

{% block content %}
<div class="calendar-container" data-api-id="{{ api_id }}">
  <div class="header-section">
      <h1 class="page-title">
          <i class="fa-solid fa-user"></i> Profil Zawodnika
      </h1>
      <a href="javascript:history.back()" style="display: inline-flex; align-items: center; gap: 8px; background: var(--bg-color); color: var(--text-color); padding: 8px 16px; border-radius: 8px; text-decoration: none; border: 1px solid var(--border-color); font-weight: 600; transition: all 0.2s ease; margin-bottom: 20px;">
        <i class="fa-solid fa-arrow-left"></i> Wróć
      </a>
  </div>

  <div id="player-content">
    <div class="loading-state">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <p>Ładowanie profilu zawodnika...</p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'matches/js/player_detail.js' %}"></script>
{% endblock %}
